<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人数字人生地图</title>
  <style>
    :root {
      --bg-color: #f0f7f4;
      --primary-color: #43a047;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
    }
    
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); margin: 0; padding: 20px 15px 80px 15px; color: var(--text-main); }
    .container { max-width: 500px; margin: 0 auto; }

    /* 顶栏控制箱 */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .title { font-size: 20px; font-weight: bold; color: #2e7d32; margin: 0; }
    .sync-btn { padding: 6px 12px; font-size: 12px; border: 1px solid #43a047; color: #43a047; background: #fff; border-radius: 20px; cursor: pointer; }

    /* 地图看板主区域 */
    .map-container { 
      background: linear-gradient(180deg, #e8f5e9 0%, #c8e6c9 100%);
      border-radius: 20px; 
      padding: 25px 15px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      position: relative;
      margin-bottom: 20px;
      border: 2px solid #a5d6a7;
    }

    /* 中央形象及激励气泡 */
    .avatar-box { text-align: center; margin-bottom: 25px; position: relative; }
    .speech-bubble {
      background: #fff;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 13px;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: inline-block;
      max-width: 80%;
      margin-bottom: 10px;
      position: relative;
    }
    .speech-bubble::after {
      content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
      border-width: 8px 8px 0; border-style: solid; border-color: #fff transparent;
    }
    
    /* 形象跳舞动画 */
    .avatar { font-size: 55px; display: inline-block; transition: transform 0.3s; cursor: pointer; }
    .avatar.dance { animation: danceAnim 0.6s infinite alternate; }
    
    @keyframes danceAnim {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-12px) rotate(-10deg) scale(1.1); }
      100% { transform: translateY(0) rotate(10deg) scale(1.1); }
    }

    /* 地图节点线路 */
    .map-nodes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .node-card {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .node-card.completed { border-color: #43a047; background: #f1f8e9; }
    .node-icon { font-size: 24px; }
    .node-info { flex: 1; }
    .node-title { font-size: 13px; font-weight: bold; }
    .node-status { font-size: 11px; color: #888; margin-top: 2px; }

    /* 弹出模态框 (管理激励语) */
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #fff; border-radius: 16px; padding: 20px; width: 88%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
    .btn-main { width: 100%; padding: 10px; background: #43a047; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .hidden { display: none !important; }

    .quote-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; }
    .quote-del { color: #e53935; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <!-- 顶栏 -->
  <div class="header">
    <h1 class="title">🗺️ 我的生活地图</h1>
    <div>
      <button class="sync-btn" onclick="exportData()">📤 导出</button>
      <button class="sync-btn" onclick="document.getElementById('fileInput').click()">📥 导入</button>
      <input type="file" id="fileInput" class="hidden" accept=".json" onchange="importData(event)">
    </div>
  </div>

  <!-- 地图展示区 -->
  <div class="map-container">
    <!-- 中央小人与激励语 -->
    <div class="avatar-box">
      <div id="speechBubble" class="speech-bubble">点击地图上的站点开始打卡吧！</div><br>
      <div id="userAvatar" class="avatar" onclick="triggerDanceManual()">💃</div>
    </div>

    <!-- 地图站点节点 -->
    <div class="map-nodes">
      <div class="node-card" id="node-省钱大计" onclick="toggleCheck('省钱大计')">
        <span class="node-icon">💰</span>
        <div class="node-info">
          <div class="node-title">省钱大计</div>
          <div class="node-status" id="status-省钱大计">未打卡</div>
        </div>
      </div>

      <div class="node-card" id="node-身体能量" onclick="toggleCheck('身体能量')">
        <span class="node-icon">🌙</span>
        <div class="node-info">
          <div class="node-title">身体状态</div>
          <div class="node-status" id="status-身体能量">未打卡</div>
        </div>
      </div>

      <div class="node-card" id="node-灵感抽屉" onclick="toggleCheck('灵感抽屉')">
        <span class="node-icon">💡</span>
        <div class="node-info">
          <div class="node-title">闪念抽屉</div>
          <div class="node-status" id="status-灵感抽屉">未打卡</div>
        </div>
      </div>

      <div class="node-card" id="node-语言学习" onclick="toggleCheck('语言学习')">
        <span class="node-icon">🗣️</span>
        <div class="node-info">
          <div class="node-title">韩/英打卡</div>
          <div class="node-status" id="status-语言学习">未打卡</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 管理激励语入口 -->
  <button class="sync-btn" style="width: 100%; padding: 10px; margin-top: 10px;" onclick="openQuoteModal()">💬 自定义我的每日激励语库</button>
</div>

<!-- 激励语管理弹窗 -->
<div id="quoteModal" class="modal hidden">
  <div class="modal-content">
    <h3 style="margin-top:0;">📝 每日激励语录库</h3>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input type="text" id="newQuoteInput" placeholder="写一句鼓励自己的话..." style="flex:1; padding:8px; border:1px solid #ddd; border-radius:6px;">
      <button onclick="addQuote()" style="background:#43a047; color:#fff; border:none; border-radius:6px; padding:0 12px; cursor:pointer;">添加</button>
    </div>
    <div id="quoteList"></div>
    <button class="btn-main" onclick="closeQuoteModal()">完成</button>
  </div>
</div>

<script>
  // 默认激励语库
  const defaultQuotes = [
    "今天也是充满能量的一天，继续加油！",
    "每一个微小的记录，都在塑造更好的自己。",
    "按自己的节奏来，不急不躁。",
    "你做得很棒了，记得多喝水休息一下！"
  ];

  function getStorageData() {
    return JSON.parse(localStorage.getItem('life_map_data') || JSON.stringify({
      quotes: defaultQuotes,
      todayChecks: {}
    }));
  }

  function saveStorageData(data) {
    localStorage.setItem('life_map_data', JSON.stringify(data));
    render();
  }

  // 获取今天的日期字符串 YYYY-MM-DD
  function getTodayKey() {
    return new Date().toISOString().slice(0, 10);
  }

  // 打卡状态切换
  function toggleCheck(nodeName) {
    const data = getStorageData();
    const today = getTodayKey();
    if (!data.todayChecks[today]) data.todayChecks[today] = {};

    data.todayChecks[today][nodeName] = !data.todayChecks[today][nodeName];
    saveStorageData(data);
    
    // 如果打卡完成，显示随机激励语
    if (data.todayChecks[today][nodeName]) {
      showRandomQuote();
    }
  }

  // 渲染界面
  function render() {
    const data = getStorageData();
    const today = getTodayKey();
    const checks = data.todayChecks[today] || {};
    
    const nodes = ['省钱大计', '身体能量', '灵感抽屉', '语言学习'];
    let completedCount = 0;

    nodes.forEach(node => {
      const isDone = checks[node];
      const card = document.getElementById(`node-${node}`);
      const statusText = document.getElementById(`status-${node}`);

      if (isDone) {
        card.classList.add('completed');
        statusText.innerText = '✅ 已打卡';
        completedCount++;
      } else {
        card.classList.remove('completed');
        statusText.innerText = '未打卡';
      }
    });

    // 全部完成触发跳舞
    const avatar = document.getElementById('userAvatar');
    if (completedCount === nodes.length && nodes.length > 0) {
      avatar.classList.add('dance');
      document.getElementById('speechBubble').innerText = "🎉 太棒啦！今天所有的目标都已达成，继续保持！";
    } else {
      avatar.classList.remove('dance');
    }
  }

  // 随机展示激励语
  function showRandomQuote() {
    const data = getStorageData();
    const quotes = data.quotes.length > 0 ? data.quotes : defaultQuotes;
    const random = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('speechBubble').innerText = random;
  }

  // 手动点击小人触发跳舞
  function triggerDanceManual() {
    const avatar = document.getElementById('userAvatar');
    avatar.classList.add('dance');
    showRandomQuote();
    setTimeout(() => {
      const data = getStorageData();
      const today = getTodayKey();
      const checks = data.todayChecks[today] || {};
      if (Object.keys(checks).length < 4) {
        avatar.classList.remove('dance');
      }
    }, 2000);
  }

  /* ---- 激励语录库管理 ---- */
  function openQuoteModal() {
    document.getElementById('quoteModal').classList.remove('hidden');
    renderQuoteList();
  }

  function closeQuoteModal() {
    document.getElementById('quoteModal').classList.add('hidden');
  }

  function renderQuoteList() {
    const data = getStorageData();
    const listEl = document.getElementById('quoteList');
    listEl.innerHTML = data.quotes.map((q, idx) => `
      <div class="quote-item">
        <span>${q}</span>
        <span class="quote-del" onclick="deleteQuote(${idx})">删除</span>
      </div>
    `).join('');
  }

  function addQuote() {
    const input = document.getElementById('newQuoteInput');
    const text = input.value.trim();
    if (!text) return;
    const data = getStorageData();
    data.quotes.push(text);
    saveStorageData(data);
    input.value = '';
    renderQuoteList();
  }

  function deleteQuote(idx) {
    const data = getStorageData();
    data.quotes.splice(idx, 1);
    saveStorageData(data);
    renderQuoteList();
  }

  /* ---- 数据导出 / 导入 ---- */
  function exportData() {
    const data = getStorageData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `人生地图备份_${getTodayKey()}.json`;
    a.click();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedData = JSON.parse(e.target.result);
        if (confirm('确认导入此数据备份吗？')) {
          saveStorageData(importedData);
          alert('数据导入成功！');
        }
      } catch (err) {
        alert('文件格式不正确，导入失败！');
      }
    };
    reader.readAsText(file);
  }

  // 页面初始化
  render();
  showRandomQuote();
</script>

</body>
</html>
