<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>省钱大计 - 理性消费助手</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 15px 15px 70px 15px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; color: #1976d2; font-size: 22px; margin-bottom: 15px; }
    
    /* 卡片通用 */
    .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    
    /* 表单 */
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .form-row { display: flex; gap: 10px; }
    .btn-submit { width: 100%; padding: 10px; background: #2196f3; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    
    /* 数据同步区 */
    .sync-bar { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 10px; }
    .btn-sync { flex: 1; padding: 8px; font-size: 12px; border: 1px solid #1976d2; color: #1976d2; background: #fff; border-radius: 6px; cursor: pointer; text-align: center; }
    
    /* 概览面板 */
    .summary { display: flex; justify-content: space-around; text-align: center; background: linear-gradient(135deg, #1e88e5, #1565c0); color: #fff; }
    .summary div span { display: block; }
    .summary-num { font-size: 18px; font-weight: bold; }
    .summary-label { font-size: 12px; opacity: 0.8; }
    
    /* 物品卡片 */
    .item-card { display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #2196f3; padding: 12px; }
    .item-info { flex: 1; }
    .item-name { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .item-tag { font-size: 11px; background: #e3f2fd; color: #1976d2; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: normal; }
    .item-sub { font-size: 12px; color: #777; }
    .item-cost { text-align: right; margin-right: 10px; }
    .cost-num { font-size: 16px; font-weight: bold; color: #e53935; }
    .cost-unit { font-size: 10px; color: #888; }
    
    .action-btns { display: flex; flex-direction: column; gap: 4px; }
    .btn-sm { border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .btn-use { background: #4caf50; color: white; font-weight: bold; }
    .btn-edit { background: #ff9800; color: white; }
    .btn-move { background: #eceff1; color: #455a64; }
    .btn-del { background: none; color: #ccc; font-size: 11px; }

    /* 底部导航栏 */
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 55px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-btn { flex: 1; text-align: center; padding: 8px 0; color: #757575; font-size: 13px; font-weight: bold; cursor: pointer; border: none; background: none; }
    .nav-btn.active { color: #1976d2; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>🐷 省钱大计</h1>

  <!-- 数据导入导出栏 -->
  <div class="sync-bar">
    <button class="btn-sync" onclick="exportData()">📤 导出备份数据</button>
    <button class="btn-sync" onclick="document.getElementById('fileInput').click()">📥 导入备份数据</button>
    <input type="file" id="fileInput" class="hidden" accept=".json" onchange="importData(event)">
  </div>

  <!-- 页面 1：又花钱？ (添加/编辑页面) -->
  <div id="pageAdd" class="card">
    <h3 id="formTitle" style="margin-top:0; color:#1976d2;">💸 记录一笔新消费</h3>
    <input type="hidden" id="editId">
    
    <div class="form-group">
      <label>物品名称</label>
      <input type="text" id="name" placeholder="例如：蓝牙耳机">
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1;">
        <label>分类</label>
        <select id="category">
          <option>数码家电</option>
          <option>服饰鞋包</option>
          <option>生活用品</option>
          <option>美妆护肤</option>
          <option>其他</option>
        </select>
      </div>
      <div class="form-group" style="flex:1;">
        <label>价格 (元)</label>
        <input type="number" id="price" step="0.01" placeholder="0.00">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1;">
        <label>已用次数</label>
        <input type="number" id="count" value="1" min="1">
      </div>
      <div class="form-group" style="flex:1;">
        <label>购入日期</label>
        <input type="date" id="purchaseDate">
      </div>
    </div>
    <button class="btn-submit" id="btnSave" onclick="saveItem()">保存记录</button>
    <button class="btn-submit hidden" id="btnCancel" style="background:#9e9e9e;" onclick="resetForm()">取消编辑</button>
  </div>

  <!-- 页面 2：所有物品 (数据概览与列表) -->
  <div id="pageList" class="hidden">
    <!-- 概览面板 -->
    <div class="card summary">
      <div>
        <span class="summary-num" id="totalSpent">￥0</span>
        <span class="summary-label">累计投入</span>
      </div>
      <div>
        <span class="summary-num" id="totalCount">0</span>
        <span class="summary-label">物品总数</span>
      </div>
    </div>

    <!-- 列表展示 -->
    <div id="itemList"></div>
  </div>
</div>

<!-- 底部固定导航栏 -->
<div class="nav-bar">
  <button class="nav-btn active" id="navBtnAdd" onclick="switchPage('add')">💸 又花钱？</button>
  <button class="nav-btn" id="navBtnList" onclick="switchPage('list')">📦 所有物品</button>
</div>

<script>
  document.getElementById('purchaseDate').valueAsDate = new Date();

  function getItems() {
    return JSON.parse(localStorage.getItem('sqdj_items') || '[]');
  }

  function saveStorage(items) {
    localStorage.setItem('sqdj_items', JSON.stringify(items));
    render();
  }

  // 页面切换控制
  function switchPage(page) {
    if (page === 'add') {
      document.getElementById('pageAdd').classList.remove('hidden');
      document.getElementById('pageList').classList.add('hidden');
      document.getElementById('navBtnAdd').classList.add('active');
      document.getElementById('navBtnList').classList.remove('active');
    } else {
      document.getElementById('pageAdd').classList.add('hidden');
      document.getElementById('pageList').classList.remove('hidden');
      document.getElementById('navBtnAdd').classList.remove('active');
      document.getElementById('navBtnList').classList.add('active');
    }
  }

  // 新增或修改物品
  function saveItem() {
    const editId = document.getElementById('editId').value;
    const name = document.getElementById('name').value.trim();
    const category = document.getElementById('category').value;
    const price = parseFloat(document.getElementById('price').value) || 0;
    const count = parseInt(document.getElementById('count').value) || 1;
    const purchaseDate = document.getElementById('purchaseDate').value;

    if (!name || price <= 0) {
      alert('请填写真实的名称和价格！');
      return;
    }

    let items = getItems();

    if (editId) {
      // 修改模式
      const item = items.find(i => i.id == editId);
      if (item) {
        item.name = name;
        item.category = category;
        item.price = price;
        item.count = count;
        item.purchaseDate = purchaseDate;
      }
    } else {
      // 新增模式
      const newItem = { id: Date.now(), name, category, price, count, purchaseDate };
      items.push(newItem);
      // 首次添加时，自动按照“单次成本”从低到高排序
      items.sort((a, b) => (a.price / a.count) - (b.price / b.count));
    }

    saveStorage(items);
    resetForm();
    switchPage('list'); // 保存后自动切换到所有物品列表
  }

  // 编辑加载回填数据
  function editItem(id) {
    const item = getItems().find(i => i.id === id);
    if (!item) return;

    document.getElementById('editId').value = item.id;
    document.getElementById('name').value = item.name;
    document.getElementById('category').value = item.category;
    document.getElementById('price').value = item.price;
    document.getElementById('count').value = item.count;
    document.getElementById('purchaseDate').value = item.purchaseDate;

    document.getElementById('formTitle').innerText = '✏️ 修改物品数据';
    document.getElementById('btnSave').innerText = '保存修改';
    document.getElementById('btnCancel').classList.remove('hidden');

    switchPage('add');
  }

  function resetForm() {
    document.getElementById('editId').value = '';
    document.getElementById('name').value = '';
    document.getElementById('price').value = '';
    document.getElementById('count').value = '1';
    document.getElementById('purchaseDate').valueAsDate = new Date();

    document.getElementById('formTitle').innerText = '💸 记录一笔新消费';
    document.getElementById('btnSave').innerText = '保存记录';
    document.getElementById('btnCancel').classList.add('hidden');
  }

  // 打卡 +1
  function useItem(id) {
    const items = getItems();
    const item = items.find(i => i.id === id);
    if (item) {
      item.count += 1;
      saveStorage(items);
    }
  }

  // 排序手动上移 / 下移
  function moveItem(index, direction) {
    const items = getItems();
    const targetIndex = index + direction;
    if (targetIndex < 0 || targetIndex >= items.length) return;
    
    // 交换位置
    const temp = items[index];
    items[index] = items[targetIndex];
    items[targetIndex] = temp;

    saveStorage(items);
  }

  // 删除
  function deleteItem(id) {
    if (confirm('确定要删除吗？')) {
      const items = getItems().filter(i => i.id !== id);
      saveStorage(items);
    }
  }

  // 渲染页面
  function render() {
    const items = getItems();
    const listEl = document.getElementById('itemList');

    let totalSpent = 0;
    items.forEach(i => totalSpent += i.price);

    document.getElementById('totalSpent').innerText = '￥' + totalSpent.toFixed(2);
    document.getElementById('totalCount').innerText = items.length;

    if (items.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; color:#999; margin-top:30px;">暂无物品，点击“又花钱？”添加第一笔记录吧！</div>';
      return;
    }

    listEl.innerHTML = items.map((item, idx) => {
      const avgCost = (item.price / item.count).toFixed(2);
      return `
        <div class="card item-card">
          <div class="item-info">
            <div class="item-name">${item.name}<span class="item-tag">${item.category}</span></div>
            <div class="item-sub">原价 ￥${item.price.toFixed(2)} | 已用 ${item.count} 次</div>
            <div class="item-sub" style="font-size:10px; color:#aaa;">购入：${item.purchaseDate}</div>
          </div>
          <div class="item-cost">
            <div class="cost-num">￥${avgCost}</div>
            <div class="cost-unit">单次成本</div>
          </div>
          <div class="action-btns">
            <button class="btn-sm btn-use" onclick="useItem(${item.id})">+1</button>
            <button class="btn-sm btn-edit" onclick="editItem(${item.id})">✏️</button>
            <div style="display:flex; gap:2px;">
              <button class="btn-sm btn-move" onclick="moveItem(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>⬆️</button>
              <button class="btn-sm btn-move" onclick="moveItem(${idx}, 1)" ${idx === items.length - 1 ? 'disabled' : ''}>⬇️</button>
            </div>
            <button class="btn-sm btn-del" onclick="deleteItem(${item.id})">删除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // 导出数据 JSON 文件
  function exportData() {
    const items = getItems();
    if (items.length === 0) return alert('当前没有可导出的数据！');
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `省钱大计数据备份_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  // 导入数据 JSON 文件
  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedItems = JSON.parse(e.target.result);
        if (Array.isArray(importedItems)) {
          if (confirm('导入将同步并保存备份数据，确定继续吗？')) {
            saveStorage(importedItems);
            alert('数据导入成功！');
          }
        }
      } catch (err) {
        alert('文件格式不正确，导入失败！');
      }
    };
    reader.readAsText(file);
  }

  render();
</script>

</body>
</html>
